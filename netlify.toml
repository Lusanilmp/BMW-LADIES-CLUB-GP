# BMW Ladies Club GP — Netlify configuration
[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Server-side metadata for blog articles (needs the template file at runtime)
[functions.article]
  included_files = ["article.html"]

# Social import runs every 6 hours (does nothing until API credentials are set)
[functions.sync-social-posts]
  schedule = "0 */6 * * *"

# ---------- clean URLs ----------
[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/article?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200
[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ---------- headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.tiktok.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.instagram.com https://www.facebook.com https://www.tiktok.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
